[build-system]
# setuptools>=77 is required by PEP 639: the SPDX string form of `license`
# below is not understood by earlier versions.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rttp"
version = "1.2.8"
description = "RTTP reference implementation: PulseHeader128 framing, rttp:// addressing, and self-certifying Ed25519 seals (RFC-002 sec. 4.1 / sec. 10 / sec. 11)."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639: an SPDX expression, not a TOML table. The licence classifier was
# removed with it - setuptools deprecates both, with a deadline of 2027-02-18.
license = "Apache-2.0"
license-files = ["LICENSE"]
# Must match the IANA registration's "Author/Change controller" verbatim.
authors = [{ name = "RTTP.COM Organization" }]
keywords = ["rttp", "protocol", "ai-agents", "intent-addressing", "uri-scheme", "ed25519", "conformance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# Zero dependencies, by design. The core package must stay installable in an
# air-gapped environment: a protocol reference implementation that cannot be
# inspected without a dependency tree is not much of a reference.
dependencies = []

[project.optional-dependencies]
# Sovereign-profile seals (seal_asym). Without this extra the core still works;
# seal_asym raises a clear SealError instead of degrading to an unsigned path.
ed25519 = ["cryptography>=41"]
dev = ["build>=1.0", "twine>=4.0"]

[project.urls]
# Every URL here was checked live on 2026-09-17. Note that `/spec/...` returns
# 404 on this host -- it is not a valid path; the specification is served at
# /RFC-002/. A dead Project-URL in published metadata is a permanent dead link.
Homepage = "https://rttp.com/"
Specification = "https://rttp.com/RFC-002/"

[project.scripts]
rttp-selftest = "rttp.selftest:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The published conformance vectors ship inside the wheel: the self-test must
# work from an installed package, offline, without cloning a repository.
rttp = ["vectors/*.json"]
